name: Linux CI

on:
  push:
  pull_request:

jobs:
  stable-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx-standard: [17, 23]
    env:
      LUNA_CXX: clang++-22
    steps:
      - uses: actions/checkout@v6
        with:
          # release_readiness.cmake verifies candidate ancestry and the entire
          # post-candidate promotion path.
          fetch-depth: 0

      - name: Install CMake, Ninja, and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake curl lsb-release ninja-build wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          rm llvm.sh

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} \
            -DLUNA_STRICT_WARNINGS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build
        run: cmake --build build --parallel --verbose

      - name: Runtime Fragment cost-probe smoke
        run: |
          cmake --build build --target runtime-fragment-benchmark --parallel
          ./build/runtime-fragment-benchmark 10 4
          ./build/runtime-fragment-benchmark 11 64
          ./build/runtime-fragment-benchmark 1001 256
          cmake -Werror=dev -DLUNA_FRAGMENT_BENCHMARK_EXECUTABLE="$PWD/build/runtime-fragment-benchmark" \
            -DLUNA_FRAGMENT_BENCHMARK_ITERATIONS=10000 \
            -DLUNA_FRAGMENT_BENCHMARK_RECORD="$PWD/build/fragment-cost-interleaved.csv" \
            -P tests/runtime_fragment_benchmark.cmake
          for profile in O0 O2 O3; do
            cmake -Werror=dev -DLUNA_COMPILED_PROBE_EXECUTABLE="$PWD/build/moonir-canonical-test" \
              -DLUNA_COMPILED_PROBE_ITERATIONS=3 -DLUNA_COMPILED_PROBE_PROFILE="$profile" \
              -P tests/compiled_fragment_benchmark.cmake
          done
          cmake -Werror=dev -DLUNA_COMPILED_PROBE_EXECUTABLE="$PWD/build/moonir-canonical-test" \
            -DLUNA_COMPILED_PROBE_ITERATIONS=10000 -DLUNA_COMPILED_SERIES_CYCLES=1 \
            -DLUNA_COMPILED_SERIES_OUTPUT_DIR="$PWD/build/compiled-fragment-series" \
            -P tests/compiled_fragment_series.cmake

      - name: Retain Fragment cost observations
        uses: actions/upload-artifact@v4
        with:
          name: fragment-cost-linux-cxx${{ matrix.cxx-standard }}-attempt${{ github.run_attempt }}
          path: |
            build/fragment-cost-interleaved.csv
            build/compiled-fragment-series/
          if-no-files-found: error
          retention-days: 14

      - name: Stable core regression suite
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          ctest --test-dir build -LE hardware --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      LUNA_CXX: clang++-22
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v6
        with:
          # The full sanitized suite includes the release-readiness ancestry
          # policy test, which requires the complete promotion history.
          fetch-depth: 0

      - name: Install CMake, Ninja, and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake curl lsb-release ninja-build wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          rm llvm.sh

      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLUNA_ENABLE_SANITIZERS=ON \
            -DLUNA_STRICT_WARNINGS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build
        run: cmake --build build-sanitized --parallel --verbose

      - name: Sanitized stable core regression suite
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          ctest --test-dir build-sanitized -LE hardware --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    env:
      TSAN_OPTIONS: halt_on_error=1:history_size=7
    steps:
      - uses: actions/checkout@v6

      - name: Install CMake, Ninja, and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake curl lsb-release ninja-build wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          rm llvm.sh

      - name: Configure ThreadSanitizer
        run: |
          cmake -S . -B build-thread-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLUNA_ENABLE_THREAD_SANITIZER=ON \
            -DLUNA_STRICT_WARNINGS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build concurrent runtime gates
        run: >-
          cmake --build build-thread-sanitized --parallel --verbose
          --target moon-runtime-test runtime-fragment-concurrency-test

      - name: ThreadSanitizer generation and Fragment transitions
        run: >-
          ctest --test-dir build-thread-sanitized
          -R 'luna\.(moon-runtime|runtime-fragment-concurrency)$' --output-on-failure
