name: Linux CI

on:
  push:
  pull_request:

jobs:
  stable-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx-standard: [17, 23]
    env:
      LUNA_CXX: clang++-22
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake, Ninja, and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake curl lsb-release ninja-build wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          rm llvm.sh

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} \
            -DLUNA_STRICT_WARNINGS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build
        run: cmake --build build --parallel --verbose

      - name: Stable core regression suite
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          ctest --test-dir build -LE hardware --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      LUNA_CXX: clang++-22
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake, Ninja, and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake curl lsb-release ninja-build wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          rm llvm.sh

      - name: Configure ASan and UBSan
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLUNA_ENABLE_SANITIZERS=ON \
            -DLUNA_STRICT_WARNINGS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Build
        run: cmake --build build-sanitized --parallel --verbose

      - name: Sanitized stable core regression suite
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          ctest --test-dir build-sanitized -LE hardware --output-on-failure
