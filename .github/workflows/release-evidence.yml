name: Release evidence

on:
  push:
    paths:
      - ecosystem.lock.json
      - tools/verify_release_evidence.js
      - tools/verify_locked_component_release.sh
      - .github/workflows/release-evidence.yml
  pull_request:
    paths:
      - ecosystem.lock.json
      - tools/verify_release_evidence.js
      - tools/verify_locked_component_release.sh
      - .github/workflows/release-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: toolchain
            repository: Luna-PL/toolchains
          - component: lunax
            repository: Luna-PL/Lunax
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify locked immutable release and attestations
        run: >-
          bash tools/verify_locked_component_release.sh
          ecosystem.lock.json
          "${{ matrix.component }}"
          "${{ matrix.repository }}"
          "release-evidence/${{ matrix.component }}"
