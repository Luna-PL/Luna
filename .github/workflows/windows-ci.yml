name: Windows CI

on:
  push:
  pull_request:

jobs:
  stable-core:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          # The release-readiness regression test verifies the complete
          # candidate-to-promotion history.
          fetch-depth: 0

      - name: Install UCRT64 CMake, Ninja, and LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=/ucrt64/bin/clang.exe \
            -DCMAKE_CXX_COMPILER=/ucrt64/bin/clang++.exe \
            -DLLVM_DIR=/ucrt64/lib/cmake/llvm \
            -DLUNA_STRICT_WARNINGS=ON

      - name: Build
        run: |
          export PATH="/ucrt64/bin:$PATH"
          cmake --build build --parallel --verbose

      - name: Runtime Fragment cost-probe smoke
        run: |
          export PATH="/ucrt64/bin:$PATH"
          cmake --build build --target runtime-fragment-benchmark --parallel
          ./build/runtime-fragment-benchmark.exe 10 4
          ./build/runtime-fragment-benchmark.exe 11 64
          ./build/runtime-fragment-benchmark.exe 1001 256
          cmake -Werror=dev -DLUNA_FRAGMENT_BENCHMARK_EXECUTABLE="$PWD/build/runtime-fragment-benchmark.exe" \
            -DLUNA_FRAGMENT_BENCHMARK_ITERATIONS=10000 \
            -DLUNA_FRAGMENT_BENCHMARK_RECORD="$PWD/build/fragment-cost-interleaved.csv" \
            -P tests/runtime_fragment_benchmark.cmake
          cmake -Werror=dev -DLUNA_FRAGMENT_BENCHMARK_EXECUTABLE="$PWD/build/runtime-fragment-benchmark.exe" \
            -DLUNA_COMPILED_PROBE_EXECUTABLE="$PWD/build/moonir-canonical-test.exe" \
            -DLUNA_COMPILED_PINNED_SERIES_OUTPUT_DIR="$PWD/build/compiled-fragment-pinned-series" \
            -P tests/runtime_fragment_affinity.cmake
          for profile in O0 O2 O3; do
            cmake -Werror=dev -DLUNA_COMPILED_PROBE_EXECUTABLE="$PWD/build/moonir-canonical-test.exe" \
              -DLUNA_COMPILED_PROBE_ITERATIONS=3 -DLUNA_COMPILED_PROBE_PROFILE="$profile" \
              -P tests/compiled_fragment_benchmark.cmake
          done
          cmake -Werror=dev -DLUNA_COMPILED_PROBE_EXECUTABLE="$PWD/build/moonir-canonical-test.exe" \
            -DLUNA_COMPILED_PROBE_ITERATIONS=10000 -DLUNA_COMPILED_SERIES_CYCLES=1 \
            -DLUNA_COMPILED_SERIES_OUTPUT_DIR="$PWD/build/compiled-fragment-series" \
            -P tests/compiled_fragment_series.cmake

      - name: Verify archived compiled Fragment bundle
        run: |
          export PATH="/ucrt64/bin:$PATH"
          cmake -Werror=dev -DLUNA_COMPILED_BUNDLE_DIR="$PWD/build/compiled-fragment-series" \
            -DLUNA_COMPILED_BUNDLE_EXPECTED_COMMIT="${{ github.sha }}" \
            -P tests/compiled_fragment_bundle.cmake
          if [ -d build/compiled-fragment-pinned-series ]; then
            cmake -Werror=dev -DLUNA_COMPILED_PINNED_BUNDLE_DIR="$PWD/build/compiled-fragment-pinned-series" \
              -DLUNA_COMPILED_PINNED_BUNDLE_EXPECTED_COMMIT="${{ github.sha }}" \
              -P tests/compiled_fragment_pinned_bundle.cmake
          fi

      - name: Package portable compiled Fragment evidence
        run: |
          export PATH="/ucrt64/bin:$PATH"
          manifest_sha="$(sha256sum build/compiled-fragment-series/manifest.csv | cut -d ' ' -f1)"
          cmake -Werror=dev -DLUNA_COMPILED_EVIDENCE_BUNDLE_DIR="$PWD/build/compiled-fragment-series" \
            -DLUNA_COMPILED_EVIDENCE_OUTPUT_DIR="$PWD/build/compiled-fragment-evidence" \
            -DLUNA_COMPILED_EVIDENCE_EXPECTED_COMMIT="${{ github.sha }}" \
            -DLUNA_COMPILED_EVIDENCE_EXPECTED_MANIFEST_SHA256="$manifest_sha" \
            -P tools/package_compiled_fragment_evidence.cmake

      - name: Retain Fragment cost observations
        uses: actions/upload-artifact@v4
        with:
          name: fragment-cost-windows-attempt${{ github.run_attempt }}
          path: |
            build/fragment-cost-interleaved.csv
            build/compiled-fragment-evidence/
            build/compiled-fragment-pinned-series/
          if-no-files-found: error
          retention-days: 14

      - name: JIT, AOT, and runtime boundaries
        run: |
          export PATH="/ucrt64/bin:$PATH"
          export LUNA_CXX=/ucrt64/bin/clang++.exe
          ctest --test-dir build \
            -R 'jit-aot|jit-runtime-symbols|gpu-target-split|aot-runtime-boundary|moon-cost-boundaries' \
            --output-on-failure

      - name: Stable core regression suite
        run: |
          export PATH="/ucrt64/bin:$PATH"
          export LUNA_CXX=/ucrt64/bin/clang++.exe
          ctest --test-dir build -LE hardware --output-on-failure
