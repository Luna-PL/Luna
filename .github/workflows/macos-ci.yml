name: macOS CI

on:
  push:
  pull_request:

jobs:
  stable-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          # The release-readiness regression test compares HEAD with HEAD^.
          fetch-depth: 2

      - name: Install CMake, Ninja, and LLVM 22
        run: brew install cmake ninja llvm@22

      - name: Configure
        shell: bash
        run: |
          llvm_prefix="$(brew --prefix llvm@22)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="${llvm_prefix}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${llvm_prefix}/bin/clang++" \
            -DLLVM_DIR="${llvm_prefix}/lib/cmake/llvm"

      - name: Build
        run: cmake --build build --parallel --verbose

      - name: Stable core regression suite
        run: |
          llvm_prefix="$(brew --prefix llvm@22)"
          export LUNA_CXX="${llvm_prefix}/bin/clang++"
          export PATH="${llvm_prefix}/bin:$PATH"
          ctest --test-dir build -LE hardware --output-on-failure
