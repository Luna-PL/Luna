name: Windows JIT relocation probe

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of sanitized canonical JIT runs
        required: true
        default: '20'
        type: number

jobs:
  canonical-asan:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - name: Install versioned CLANG64 LLVM 22
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm22
            mingw-w64-clang-x86_64-clang22
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-libunwind
            mingw-w64-clang-x86_64-zstd

      - name: Restore verified LLVM 22 sanitizer runtime
        run: |
          export PATH="/clang64/opt/llvm22/bin:/clang64/bin:$PATH"
          llvm_version="$(llvm-config --version)"
          clang_version="$(clang++ -dumpversion)"
          if [[ "$llvm_version" != 22.* || "$clang_version" != 22.* ]]; then
            printf 'This probe requires LLVM and Clang 22; found LLVM %s, Clang %s\n' "$llvm_version" "$clang_version" >&2
            exit 1
          fi
          runtime_dir="$(mktemp -d)"
          archive="$runtime_dir/compiler-rt-22.1.8-3.pkg.tar.zst"
          curl --fail --location --silent --show-error \
            'https://repo.msys2.org/mingw/clang64/mingw-w64-clang-x86_64-compiler-rt-22.1.8-3-any.pkg.tar.zst' \
            --output "$archive"
          printf '4018e4b6e72563b35001c6c3edcb77d6624b32ffa095d8b03149d504c827f5bc  %s\n' "$archive" | sha256sum --check
          tar -xf "$archive" -C "$runtime_dir"
          resource_dir="$(clang++ -print-resource-dir)"
          cp "$runtime_dir/clang64/lib/clang/22/lib/windows/"libclang_rt.asan* "$resource_dir/lib/windows/"
          cp "$runtime_dir/clang64/lib/clang/22/lib/windows/"libclang_rt.ubsan* "$resource_dir/lib/windows/"
          cp "$runtime_dir/clang64/bin/libclang_rt.asan_dynamic-x86_64.dll" /clang64/bin/
          test -f "$resource_dir/lib/windows/libclang_rt.asan_dynamic-x86_64.dll.a"
          test -f "$resource_dir/lib/windows/libclang_rt.ubsan_standalone-x86_64.a"
          test -f /clang64/lib/libunwind.a
          test -f /clang64/include/c++/v1/string

      - name: Configure sanitized canonical JIT target
        run: |
          export PATH="/clang64/opt/llvm22/bin:/clang64/bin:$PATH"
          export LIBRARY_PATH="/clang64/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export CPLUS_INCLUDE_PATH="/clang64/include/c++/v1${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          cmake -S . -B build-jit-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=/clang64/opt/llvm22/bin/clang.exe \
            -DCMAKE_CXX_COMPILER=/clang64/opt/llvm22/bin/clang++.exe \
            -DLLVM_DIR=/clang64/opt/llvm22/lib/cmake/llvm \
            -DLUNA_ENABLE_SANITIZERS=ON \
            -DLUNA_STRICT_WARNINGS=ON

      - name: Build canonical JIT target
        run: |
          export PATH="/clang64/opt/llvm22/bin:/clang64/bin:$PATH"
          export LIBRARY_PATH="/clang64/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export CPLUS_INCLUDE_PATH="/clang64/include/c++/v1${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          cmake --build build-jit-asan --target moonir-canonical-test --parallel 4

      - name: Repeat sanitized canonical JIT
        run: |
          export PATH="/clang64/opt/llvm22/bin:/clang64/bin:$PATH"
          export LIBRARY_PATH="/clang64/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export CPLUS_INCLUDE_PATH="/clang64/include/c++/v1${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}"
          export LUNA_CXX=/clang64/opt/llvm22/bin/clang++.exe
          export ASAN_OPTIONS=detect_leaks=0:alloc_dealloc_mismatch=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          count='${{ inputs.iterations }}'
          if ! [[ "$count" =~ ^[0-9]+$ ]] || (( count < 1 || count > 100 )); then
            echo "iterations must be between 1 and 100" >&2
            exit 1
          fi
          mkdir -p build-jit-asan/relocation-probe
          {
            git rev-parse HEAD
            clang++ --version | head -n 1
            llvm-config --version
            printf 'iterations=%s\n' "$count"
          } > build-jit-asan/relocation-probe/context.txt
          for (( run = 1; run <= count; ++run )); do
            printf -v label '%03d' "$run"
            log="build-jit-asan/relocation-probe/run-${label}.log"
            if ./build-jit-asan/moonir-canonical-test.exe > "$log" 2>&1; then
              printf 'canonical JIT run %d/%d passed\n' "$run" "$count"
            else
              printf 'canonical JIT run %d/%d failed; last trace:\n' "$run" "$count" >&2
              tail -n 100 "$log" >&2
              exit 1
            fi
          done

      - name: Retain JIT relocation probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-jit-relocation-attempt${{ github.run_attempt }}
          path: build-jit-asan/relocation-probe/
          if-no-files-found: warn
          retention-days: 14
